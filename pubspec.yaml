name: vault_security_software
description: "Secure Officer Vault — mobile console for the Nepali Army device-security platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # Secure token storage (Keychain / Keystore)
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Typography + formatting
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # 2FA QR, document upload/open, report export
  qr_flutter: ^4.1.0
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
